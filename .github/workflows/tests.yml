name: Tests

on:
  push:
    branches: [ main, windows-support ]
  pull_request:
    branches: [ main ]

jobs:
  unit-tests:
    name: Unit Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        moonshine: ['^4.0']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, ctype, json, bcmath
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Install MoonShine for unit tests
        run: composer require moonshine/moonshine:${{ matrix.moonshine }} --dev --no-interaction

      - name: Run unit tests
        run: composer test:unit

  e2e-tests:
    name: E2E Tests with MoonShine (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        moonshine: ['^4.0']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, ctype, json, bcmath
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Install MoonShine for E2E tests
        run: composer require moonshine/moonshine:${{ matrix.moonshine }} --dev --no-interaction

      - name: Run all tests
        run: composer test:all
