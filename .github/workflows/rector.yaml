# github action that checks code with Rector
name: Rector

# Allow this workflow to use the GITHUB_TOKEN for pushing changes
permissions:
    contents: write

on: [push]

jobs:
    rector:
        runs-on: ubuntu-latest
        steps:
            -
                uses: actions/checkout@v3
                with:
                    # Must be used to trigger workflow after push
                    token: ${{ secrets.GITHUB_TOKEN }}
                    # Ensure the checkout persists the credentials so later
                    # git push operations (used by git-auto-commit-action)
                    # can authenticate.
                    persist-credentials: true
                    # fetch full history so branch operations are safe
                    fetch-depth: 0

            -
                uses: shivammathur/setup-php@v2
                with:
                    php-version: 8.2
                    coverage: none

            -   uses: "ramsey/composer-install@v2"

            -   run: vendor/bin/rector process --clear-cache

            -   name: Extract branch name
                shell: bash
                run: echo "##[set-output name=branch;]$(echo ${GITHUB_REF#refs/heads/})"
                id: extract_branch
            -
                # commit only to core contributors who have repository access
                uses: stefanzweifel/git-auto-commit-action@v4
                with:
                    commit_message: '[rector] Rector fixes'
                    push_options: '--force'
                    branch: ${{ steps.extract_branch.outputs.branch }}
                env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
